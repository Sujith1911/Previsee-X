name: PRIVISEE-X CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'

    - name: Run Unit Tests
      run: node tests/main.js

    - name: Lint Code (Optional)
      run: |
        # If we had eslint
        # npm install eslint
        # npx eslint src/
        echo "Linting skipped (no linter config)"
