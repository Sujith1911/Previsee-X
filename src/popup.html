<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRIVISEE-X</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 350px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 5px;
    }
    .header p {
      font-size: 12px;
      opacity: 0.9;
    }
    .risk-gauge {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      margin-bottom: 16px;
    }
    .risk-score {
      font-size: 48px;
      font-weight: 700;
      margin: 12px 0;
    }
    .risk-level {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.9;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    .stat-card {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }
    .stat-value {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .stat-label {
      font-size: 11px;
      opacity: 0.8;
      text-transform: uppercase;
    }
    .explanation {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 16px;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: rgba(255,255,255,0.2);
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover {
      background: rgba(255,255,255,0.3);
      transform: translateY(-2px);
    }
    .loading {
      text-align: center;
      padding: 40px 0;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🛡️ PRIVISEE-X</h1>
    <p>Privacy Intelligence</p>
  </div>

  <div id="loading" class="loading">
    <p>Analyzing...</p>
  </div>

  <div id="content" style="display: none;">
    <div class="risk-gauge">
      <div class="risk-level" id="riskLevel">ANALYZING</div>
      <div class="risk-score" id="riskScore">--</div>
      <div class="risk-level">RISK SCORE</div>
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-value" id="trackerCount">0</div>
        <div class="stat-label">Trackers</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="cookieCount">0</div>
        <div class="stat-label">Cookies</div>
      </div>
    </div>

    <div class="explanation" id="explanation">
      Loading privacy analysis...
    </div>

    <button class="btn" id="dashboardBtn">View Dashboard</button>
  </div>

  <script type="module" src="ui/PopupController.js"></script>
</body>
</html>
